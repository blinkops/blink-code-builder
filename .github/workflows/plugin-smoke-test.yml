name: Plugin smoke test

on:
  pull_request:
    paths:
      - "plugins/blink-code-builder/**"
      - ".github/scripts/plugin_smoke_test.py"
      - ".github/workflows/plugin-smoke-test.yml"

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Git Bash on Windows, the shell Claude Code runs hooks in.
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Same fix the setup-blink-plugin skill gives python.org installs, which have no python3.
      - name: Make python3 available
        run: |
          python3 --version 2>/dev/null || python -c "import shutil, sys, pathlib; exe = pathlib.Path(sys.executable); shutil.copy(exe, exe.with_name('python3.exe'))"
          python3 --version

      - name: Smoke test
        run: python3 .github/scripts/plugin_smoke_test.py
